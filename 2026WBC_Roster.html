                seed: seed,
                backgroundColor: "e5e7eb",
                top: "shortHair,shortHairDreads01,shortHairDreads02,shortHairFrizzle,shortHairShaggy,shortHairSides,shortHairTheCaesar,shortHairTheCaesarSidePart",

                mouth: "default,smile,twinkle,grimace,serious,scream",
                facialHairProbability: "20"

                        posMatch = p.position.includes('投手');
                    } else if (posFilter === '捕手') {

                        posMatch = p.position.includes('外野');
                    }
                }
                return groupMatch && posMatch;
            });

                return filteredPlayers.filter(p => {
                    if (type === '投手') return p.position.includes('投手');
                    if (type === '捕手') return p.position.includes('捕手');

                    {filteredPlayers.length === 0 ? (
                    <div className="text-center py-20 bg-white rounded-xl border border-dashed border-slate-300">

                    </div>

                        <>

                                {filteredPlayers.map(player => (
                                <PlayerCard key={player.id} player={player} onClick={setSelectedPlayer} />

                            </div>
                        ) : (
                            <div className="space-y-12">
                                {['投手', '捕手', '內野手', '外野手'].map(type => {
                                    const typePlayers = getPlayersBySpecificPos(type);
                                    if (typePlayers.length === 0) return null;
                                    return (
                                        <section key={type} className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                                            <div className="flex items-center space-x-3 mb-4 border-b border-slate-200 pb-2">
                                                <h3 className="text-xl font-black text-slate-800 flex items-center">

                                                    {type === '捕手' && <Shield size={20} className="mr-2 text-yellow-500" />}

                                    );
                                })}

                        )}

                    )}

        root.render(<App />);
