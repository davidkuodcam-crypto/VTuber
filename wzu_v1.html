<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM Overlay Tool</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', sans-serif;
        }

        /* 1. 背景層 */
        #webpage-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 0;
            background: #fff;
        }

        /* 2. 角色層 */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
            /* 預設穿透，由 JS 動態控制 */
            pointer-events: none;
        }

        /* Loading */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #ccc;
            border-top: 3px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    
    <!-- Import Maps -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js",
                "@pixiv/three-vrm-animation": "https://unpkg.com/@pixiv/three-vrm-animation@3.0.0/lib/three-vrm-animation.module.js"
            }
        }
    </script>
</head>
<body>

    <iframe id="webpage-frame" src="https://a001.wzu.edu.tw/"></iframe>

    <div id="loading-overlay"><div class="spinner"></div></div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
        import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

        // --- Configuration ---
        const MODEL_URL = 'https://davidkuodcam-crypto.github.io/VTuber/AvatarSample_C.vrm';
        const ANIMATION_URL = 'https://davidkuodcam-crypto.github.io/VTuber/Taunt_with_Skin.vrma';
        const SPECIAL_ANIMATION_URL = 'https://davidkuodcam-crypto.github.io/VTuber/Breakdance_Freeze_Var_3.vrma';
        
        // Physics Params
        const DRAG_STIFFNESS = 300.0;
        const DRAG_FRICTION = 0.85;

        // Character Dimensions
        const CHAR_HALF_WIDTH = 0.4;
        const CHAR_HEIGHT = 1.6;

        // --- State ---
        let scene, camera, renderer, clock, mixer;
        let currentVrm = null;
        let idleAction = null;
        let specialAction = null;
        let screenBounds = { minX: -5, maxX: 5, minY: -5, maxY: 5 };

        // Interaction State
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        let isDragging = false;
        let isHovering = false; // 是否游標在角色上
        let isPerformingSpecial = false; 
        let savedPosition = new THREE.Vector3(); 
        
        let dragPlane = new THREE.Plane();
        let targetPosition = new THREE.Vector3();
        let velocity = new THREE.Vector3(0, 0, 0);

        // DOM
        const container = document.getElementById('canvas-container');
        const loadingOverlay = document.getElementById('loading-overlay');

        function init() {
            // 1. Scene
            scene = new THREE.Scene();

            // 2. Camera (固定位置)
            camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 50.0);
            camera.position.set(0.0, 1.0, 6.0); 
            // 注意：這裡假設相機沒有旋轉 (lookAt 預設向 -Z)

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);

            // 4. Lights
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xffffff, 1.0);
            scene.add(hemiLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(5, 10, 5);
            scene.add(dirLight);

            // 5. Events
            // 使用 window 層級監聽，確保隨時能捕捉滑鼠移動
            window.addEventListener('mousemove', onGlobalMouseMove);
            window.addEventListener('mousedown', onGlobalMouseDown);
            window.addEventListener('mouseup', onGlobalMouseUp);
            
            // Touch Events
            window.addEventListener('touchstart', onGlobalTouchStart, {passive: false});
            window.addEventListener('touchmove', onGlobalTouchMove, {passive: false});
            window.addEventListener('touchend', onGlobalMouseUp);

            window.addEventListener('resize', onWindowResize);

            clock = new THREE.Clock();

            // 初始計算邊界
            updateBoundaries();

            loadAssets();
            animate();
        }

        // 使用三角函數計算邊界，比 unproject 更穩定
        function updateBoundaries() {
            const vFOV = THREE.MathUtils.degToRad(camera.fov); // 30度轉弧度
            const dist = camera.position.z; // 6.0
            const visibleHeight = 2 * Math.tan(vFOV / 2) * dist;
            const visibleWidth = visibleHeight * camera.aspect;

            // Camera Y is 1.0
            const cameraY = camera.position.y;
            
            screenBounds.minY = cameraY - visibleHeight / 2;
            screenBounds.maxY = cameraY + visibleHeight / 2;
            screenBounds.minX = -visibleWidth / 2; // Camera X is 0
            screenBounds.maxX = visibleWidth / 2;
        }

        async function loadAssets() {
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));
            loader.register((parser) => new VRMAnimationLoaderPlugin(parser));

            try {
                const vrmGltf = await loader.loadAsync(MODEL_URL);
                const vrm = vrmGltf.userData.vrm;
                currentVrm = vrm;
                
                VRMUtils.rotateVRM0(vrm);
                vrm.scene.rotation.y = 0; 

                // 強制重新計算邊界，確保正確
                updateBoundaries();

                // 初始位置：左下角
                vrm.scene.position.set(
                    screenBounds.minX + CHAR_HALF_WIDTH + 0.2, 
                    screenBounds.minY + 0.1, 
                    0.0
                ); 
                
                // 立即更新目標位置，避免一開始就飄移
                targetPosition.copy(vrm.scene.position);

                scene.add(vrm.scene);

                mixer = new THREE.AnimationMixer(currentVrm.scene);

                const vrmaGltf1 = await loader.loadAsync(ANIMATION_URL);
                const clip1 = createVRMAnimationClip(vrmaGltf1.userData.vrmAnimations[0], currentVrm);
                idleAction = mixer.clipAction(clip1);
                idleAction.play(); 

                const vrmaGltf2 = await loader.loadAsync(SPECIAL_ANIMATION_URL);
                const clip2 = createVRMAnimationClip(vrmaGltf2.userData.vrmAnimations[0], currentVrm);
                specialAction = mixer.clipAction(clip2);
                specialAction.setLoop(THREE.LoopOnce); 
                specialAction.clampWhenFinished = false; 

                mixer.addEventListener('finished', (e) => {
                    if (e.action === specialAction) {
                        isPerformingSpecial = false;
                        currentVrm.scene.position.copy(savedPosition);
                        targetPosition.copy(savedPosition);
                        velocity.set(0, 0, 0);

                        idleAction.reset();
                        idleAction.play();
                        specialAction.crossFadeTo(idleAction, 0.5);
                    }
                });

                loadingOverlay.style.opacity = 0;
                setTimeout(() => loadingOverlay.style.display = 'none', 500);

            } catch (e) {
                console.error(e);
            }
        }

        function playSpecialAnimation() {
            if (!specialAction || !idleAction || isPerformingSpecial) return;

            isPerformingSpecial = true;
            savedPosition.copy(currentVrm.scene.position);
            currentVrm.scene.position.set(0, 0, 0); 
            
            specialAction.reset();
            specialAction.play();
            idleAction.crossFadeTo(specialAction, 0.3);
        }

        // --- Smart Interaction Logic (Raycasting) ---
        // 核心邏輯：滑鼠移動時，檢查是否碰到角色。如果碰到，開啟 Canvas 互動；否則關閉。

        function updateMouse(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
        }

        function checkIntersection() {
            if (!currentVrm) return;

            raycaster.setFromCamera(mouse, camera);
            
            // 偵測是否碰到角色的任何部分
            // 使用 recursive: true 來檢查所有子物件 (Mesh)
            const intersects = raycaster.intersectObject(currentVrm.scene, true);

            if (intersects.length > 0) {
                if (!isHovering) {
                    isHovering = true;
                    container.style.pointerEvents = 'auto'; // 開啟互動
                    container.style.cursor = 'grab';
                }
            } else {
                if (isHovering && !isDragging) {
                    isHovering = false;
                    container.style.pointerEvents = 'none'; // 關閉互動 (穿透)
                    container.style.cursor = 'default';
                }
            }
        }

        function onGlobalMouseMove(e) {
            updateMouse(e.clientX, e.clientY);

            if (isDragging) {
                // 拖曳中：直接移動
                e.preventDefault();
                moveDrag();
            } else {
                // 非拖曳中：檢查是否碰到角色
                checkIntersection();
            }
        }

        function onGlobalMouseDown(e) {
            // 只有當我們處於 Hover 狀態 (pointerEvents: auto) 時，Canvas 才會接收到點擊
            // 但為了保險，再次檢查 raycast
            if (!currentVrm || isPerformingSpecial) return;

            updateMouse(e.clientX, e.clientY);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(currentVrm.scene, true);

            if (intersects.length > 0) {
                // 確實點到角色了
                e.preventDefault();

                // 中鍵 (1)
                if (e.button === 1) {
                    playSpecialAnimation();
                    return;
                }

                // 左鍵 (0)
                if (e.button === 0) {
                    startDrag();
                }
            }
        }

        function onGlobalTouchStart(e) {
            if (e.touches.length > 0) {
                updateMouse(e.touches[0].clientX, e.touches[0].clientY);
                
                // Touch 需要主動檢查，因為沒有 hover
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(currentVrm.scene, true);
                
                if (intersects.length > 0 && !isPerformingSpecial) {
                    e.preventDefault(); // 防止捲動
                    container.style.pointerEvents = 'auto'; // 強制開啟
                    startDrag();
                }
            }
        }

        function startDrag() {
            isDragging = true;
            container.style.cursor = 'grabbing';
            // 鎖定在 Z=0 平面拖曳
            dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 0, 1), currentVrm.scene.position);
            targetPosition.copy(currentVrm.scene.position);
        }

        function onGlobalTouchMove(e) {
            if (isDragging && e.touches.length > 0) {
                updateMouse(e.touches[0].clientX, e.touches[0].clientY);
                moveDrag();
            }
        }

        function moveDrag() {
            raycaster.setFromCamera(mouse, camera);
            const targetPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, targetPoint);
            
            if (targetPoint) {
                targetPosition.copy(targetPoint);
                clampPosition(targetPosition);
            }
        }

        function onGlobalMouseUp(e) {
            if (isDragging) {
                isDragging = false;
                container.style.cursor = 'grab';
                // 放開後，重新檢查一次是否還在角色上，決定是否要關閉 pointerEvents
                checkIntersection();
            }
        }

        function clampPosition(pos) {
            pos.x = Math.max(screenBounds.minX + CHAR_HALF_WIDTH, Math.min(screenBounds.maxX - CHAR_HALF_WIDTH, pos.x));
            pos.y = Math.max(screenBounds.minY, Math.min(screenBounds.maxY - CHAR_HEIGHT, pos.y));
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);
            
            if (currentVrm) {
                const pos = currentVrm.scene.position;

                if (!isPerformingSpecial) {
                    if (isDragging) {
                        const displacement = new THREE.Vector3().subVectors(targetPosition, pos);
                        const force = displacement.multiplyScalar(DRAG_STIFFNESS);
                        velocity.add(force.multiplyScalar(delta));
                        velocity.multiplyScalar(DRAG_FRICTION); 
                        pos.add(velocity.clone().multiplyScalar(delta));
                    } else {
                        velocity.set(0, 0, 0); 
                    }
                    clampPosition(pos);
                }

                currentVrm.scene.rotation.y = 0; 
            }

            if (mixer) mixer.update(delta);
            if (currentVrm) currentVrm.update(delta);
            
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateBoundaries();
            
            // 視窗變形時，重新限制角色位置，避免跑出視窗
            if (currentVrm && !isPerformingSpecial && !isDragging) {
                clampPosition(currentVrm.scene.position);
                targetPosition.copy(currentVrm.scene.position);
            }
        }

        init();
    </script>
</body>
</html>
