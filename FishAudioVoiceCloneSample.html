<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Audio 語音工作室</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (改用更穩定的 cdnjs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX (改用更穩定的 cdnjs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 使用內嵌 SVG 確保圖標渲染穩定
        const Icon = ({ name, size = 20, className = "", fill = "none" }) => {
            const icons = {
                Volume2: <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>,
                ShieldCheck: <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>,
                Trash2: <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>,
                Loader2: <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="2" y2="6"></line><line x1="12" x2="12" y1="18" y2="22"></line><line x1="4.93" x2="7.76" y1="4.93" y2="7.76"></line><line x1="16.24" x2="19.07" y1="16.24" y2="19.07"></line><line x1="2" x2="6" y1="12" y2="12"></line><line x1="18" x2="22" y1="12" y2="12"></line><line x1="4.93" x2="7.76" y1="19.07" y2="16.24"></line><line x1="16.24" x2="19.07" y1="7.76" y2="4.93"></line></svg>,
                Play: <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
                Download: <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>,
                AlertCircle: <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>,
                Settings: <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
                Globe: <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="2" x2="22" y1="12" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>,
                Save: <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
                Info: <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="16" y2="12"></line><line x1="12" x2="12.01" y1="8" y2="8"></line></svg>
            };
            return icons[name] || null;
        };

        function App() {
            const [apiKey, setApiKey] = useState('');
            const [voiceId, setVoiceId] = useState('');
            const [showApiKey, setShowApiKey] = useState(false);
            const [useProxy, setUseProxy] = useState(true);
            const [text, setText] = useState('');
            const [format, setFormat] = useState('mp3');
            const [isLoading, setIsLoading] = useState(false);
            const [audioUrl, setAudioUrl] = useState(null);
            const [error, setError] = useState(null);

            useEffect(() => {
                const savedKey = localStorage.getItem('fish_audio_api_key');
                const savedVoice = localStorage.getItem('fish_audio_voice_id');
                const savedProxy = localStorage.getItem('fish_audio_use_proxy');
                if (savedKey) setApiKey(savedKey);
                if (savedVoice) setVoiceId(savedVoice);
                if (savedProxy !== null) setUseProxy(savedProxy === 'true');
            }, []);

            const saveSettings = () => {
                localStorage.setItem('fish_audio_api_key', apiKey);
                localStorage.setItem('fish_audio_voice_id', voiceId);
                localStorage.setItem('fish_audio_use_proxy', useProxy);
                const btn = document.getElementById('save-btn');
                if (btn) {
                    const originalText = btn.innerText;
                    btn.innerText = '已儲存！';
                    setTimeout(() => btn.innerText = originalText, 2000);
                }
            };

            const handleGenerate = async () => {
                if (!apiKey || !voiceId || !text) {
                    setError('請檢查：API Key、Voice ID 與文字內容是否皆已填寫');
                    return;
                }

                setIsLoading(true);
                setError(null);
                setAudioUrl(null);

                try {
                    const apiUrl = 'https://api.fish.audio/v1/tts';
                    const finalUrl = useProxy 
                        ? `https://corsproxy.io/?${encodeURIComponent(apiUrl)}` 
                        : apiUrl;

                    const response = await fetch(finalUrl, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json',
                            'Accept': 'audio/*'
                        },
                        body: JSON.stringify({
                            text: text,
                            references: [{ id: voiceId, type: 'reference' }],
                            format: format,
                            latency: 'normal'
                        }),
                    });

                    if (!response.ok) {
                        let errorDetail = '';
                        try {
                            const errorJson = await response.json();
                            errorDetail = errorJson.message || JSON.stringify(errorJson);
                        } catch (e) {
                            errorDetail = `錯誤代碼: ${response.status}`;
                        }
                        throw new Error(errorDetail);
                    }

                    const blob = await response.blob();
                    if (blob.size === 0) throw new Error('生成的音訊文件大小為 0');
                    
                    const url = URL.createObjectURL(blob);
                    setAudioUrl(url);
                } catch (err) {
                    console.error('TTS API Error:', err);
                    setError(err.message === 'Failed to fetch' 
                        ? '連線失敗。請確認「跨域代理」已開啟，或檢查您的網路連線。' 
                        : `生成失敗: ${err.message}`);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen text-slate-900 p-4 md:p-8">
                    <div className="max-w-6xl mx-auto">
                        <header className="mb-8 border-b border-slate-200 pb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <h1 className="text-3xl font-extrabold text-slate-900 flex items-center gap-3">
                                    <div className="p-2 bg-blue-600 rounded-lg text-white flex items-center justify-center">
                                        <Icon name="Volume2" size={24} />
                                    </div>
                                    Fish Audio 語音工作室
                                </h1>
                                <p className="text-slate-500 mt-1 font-medium">個人聲音克隆與語音合成</p>
                            </div>
                            <div className="flex items-center gap-2 bg-green-50 text-green-700 px-4 py-2 rounded-xl text-sm border border-green-100 font-medium">
                                <Icon name="ShieldCheck" size={16} /> 安全加密傳輸
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            <div className="lg:col-span-8 space-y-6">
                                <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="p-6">
                                        <div className="flex justify-between items-center mb-4">
                                            <label className="text-sm font-bold text-slate-700 uppercase tracking-tight font-mono">Input Text</label>
                                            <button onClick={() => setText('')} className="text-xs text-slate-400 hover:text-red-500 flex items-center gap-1 transition-all">
                                                <Icon name="Trash2" size={14} /> 清空
                                            </button>
                                        </div>
                                        <textarea
                                            value={text}
                                            onChange={(e) => setText(e.target.value)}
                                            placeholder="在此輸入您想要合成的內容..."
                                            className="w-full h-72 p-5 rounded-2xl bg-slate-50 border border-slate-100 focus:ring-4 focus:ring-blue-500/10 focus:bg-white transition-all outline-none resize-none text-lg leading-relaxed"
                                        />
                                        <div className="mt-3 flex justify-end text-[10px] font-bold text-slate-400">
                                            CHARACTERS: {text.length}
                                        </div>
                                    </div>
                                    
                                    <div className="p-6 bg-slate-50 border-t border-slate-100">
                                        <button
                                            onClick={handleGenerate}
                                            disabled={isLoading}
                                            className={`w-full flex items-center justify-center gap-3 py-4 rounded-2xl font-bold text-white transition-all shadow-xl ${
                                                isLoading ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 active:scale-95 shadow-blue-200'
                                            }`}
                                        >
                                            {isLoading ? (
                                                <><Icon name="Loader2" size={20} className="animate-spin" /> 正在生成語音...</>
                                            ) : (
                                                <><Icon name="Play" size={20} fill="white" /> 生成語音檔案</>
                                            )}
                                        </button>
                                    </div>
                                </div>

                                {audioUrl && (
                                    <div className="bg-slate-900 rounded-3xl p-8 text-white shadow-2xl animate-in fade-in zoom-in-95">
                                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                                            <div className="space-y-1">
                                                <h3 className="text-xl font-bold flex items-center gap-2 tracking-tight">
                                                    <Icon name="Play" size={20} className="text-blue-400" fill="currentColor" /> 合成成功
                                                </h3>
                                                <p className="text-slate-400 text-sm">您可以直接播放或下載離線使用</p>
                                            </div>
                                            <a 
                                                href={audioUrl} 
                                                download={`fish_audio_${Date.now()}.${format}`}
                                                className="flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-2xl text-sm font-bold transition-all"
                                            >
                                                <Icon name="Download" size={18} /> 下載檔案
                                            </a>
                                        </div>
                                        <div className="mt-8 bg-slate-800 p-2 rounded-2xl">
                                            <audio src={audioUrl} controls className="w-full h-12" />
                                        </div>
                                    </div>
                                )}

                                {error && (
                                    <div className="bg-red-50 border-2 border-red-100 text-red-700 p-5 rounded-3xl flex items-start gap-4">
                                        <div className="bg-red-100 p-2 rounded-lg"><Icon name="AlertCircle" size={20} className="text-red-600" /></div>
                                        <div className="text-sm leading-relaxed"><p className="font-bold">發生錯誤</p><p>{error}</p></div>
                                    </div>
                                )}
                            </div>

                            <div className="lg:col-span-4 space-y-6">
                                <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
                                    <h2 className="text-xs font-black text-slate-400 mb-6 flex items-center gap-2 uppercase tracking-widest border-b border-slate-100 pb-4">
                                        <Icon name="Settings" size={16} className="text-blue-600" /> Configuration
                                    </h2>
                                    
                                    <div className="space-y-5">
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-500 mb-2 uppercase tracking-tighter">API Key</label>
                                            <div className="relative">
                                                <input
                                                    type={showApiKey ? "text" : "password"}
                                                    value={apiKey}
                                                    onChange={(e) => setApiKey(e.target.value)}
                                                    placeholder="sk_..."
                                                    className="w-full p-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm font-mono"
                                                />
                                                <button onClick={() => setShowApiKey(!showApiKey)} className="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] font-black text-slate-400 hover:text-blue-600 transition-colors">
                                                    {showApiKey ? "HIDE" : "SHOW"}
                                                </button>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-[10px] font-black text-slate-500 mb-2 uppercase tracking-tighter">Voice ID</label>
                                            <input
                                                type="text"
                                                value={voiceId}
                                                onChange={(e) => setVoiceId(e.target.value)}
                                                placeholder="Model ID"
                                                className="w-full p-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm font-mono"
                                            />
                                        </div>

                                        <div className="flex items-center justify-between p-4 bg-blue-50/30 border border-blue-100 rounded-2xl">
                                            <div className="flex items-center gap-3">
                                                <div className="p-2 bg-white rounded-lg shadow-sm flex items-center justify-center text-blue-600">
                                                    <Icon name="Globe" size={16} />
                                                </div>
                                                <div className="leading-tight">
                                                    <span className="text-xs font-bold text-blue-900 block">跨域代理</span>
                                                    <span className="text-[10px] text-blue-500 font-medium">解決連線阻擋</span>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => setUseProxy(!useProxy)}
                                                className={`w-12 h-6 rounded-full relative transition-colors ${useProxy ? 'bg-blue-600' : 'bg-slate-300'}`}
                                            >
                                                <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all shadow-sm ${useProxy ? 'right-1' : 'left-1'}`} />
                                            </button>
                                        </div>

                                        <button id="save-btn" onClick={saveSettings} className="w-full flex items-center justify-center gap-2 py-4 bg-slate-900 text-white rounded-2xl hover:bg-black transition-all text-sm font-bold shadow-lg shadow-slate-200">
                                            <Icon name="Save" size={18} /> 儲存目前設定
                                        </button>
                                    </div>

                                    <div className="mt-10 pt-6 border-t border-slate-100">
                                        <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Output Format</h3>
                                        <div className="grid grid-cols-3 gap-2">
                                            {['mp3', 'wav', 'opus'].map((f) => (
                                                <button
                                                    key={f}
                                                    onClick={() => setFormat(f)}
                                                    className={`py-3 text-[10px] rounded-xl border font-black transition-all ${
                                                        format === f 
                                                            ? 'bg-blue-600 border-blue-600 text-white shadow-md' 
                                                            : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'
                                                    }`}
                                                >
                                                    {f.toUpperCase()}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-100 rounded-3xl p-6 border border-slate-200 border-dashed">
                                    <h4 className="text-xs font-bold text-slate-700 mb-3 flex items-center gap-2 tracking-tight">
                                        <Icon name="Info" size={16} className="text-blue-600" /> 使用提示
                                    </h4>
                                    <ul className="text-[11px] text-slate-500 space-y-2 leading-relaxed font-medium">
                                        <li>• 您的 API Key 會加密儲存於本機。</li>
                                        <li>• 若無法生成，請務必開啟 <span className="text-blue-600">跨域代理</span>。</li>
                                        <li>• 語音生成可能需要 1-5 秒的處理時間。</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
